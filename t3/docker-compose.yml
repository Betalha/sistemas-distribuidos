services:
  db:
    image: mysql:5.7
    # o padrão (151) gerava erro 500 com 2+ instâncias: cada Apache abre até 150 conexões
    command: --max-connections=1000
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql

  # Um único serviço escalável: 3 réplicas por padrão; --scale wordpress=N sobrescreve
  wordpress:
    image: wordpress:5.4.2-php7.2-apache
    deploy:
      replicas: 3
    depends_on: [db]
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./html:/var/www/html

  nginx:
    image: nginx:1.19.0
    restart: always
    depends_on: [wordpress]
    ulimits:
      nofile: 65535   # o padrão (1024) gerava "Too many open files" com 1000 usuários
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  # Fora do "docker compose up": chamado à parte (docker compose run locust / run.sh)
  locust:
    image: locustio/locust:2.32.0
    profiles: [locust]
    depends_on: [nginx]
    ulimits:
      nofile: 65535
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust
    command: -f /mnt/locust/locustfile.py -H http://nginx

volumes:
  db_data:
